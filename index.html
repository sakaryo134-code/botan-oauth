<h1>YouTube自動投稿ツール（個人用）</h1>
<p>このアプリケーションは、所有者本人が自分のYouTubeチャンネルへ動画を自動投稿するために使用する、個人用のツールです。一般公開向けのサービスではありません。</p>
<h2>機能</h2>
<ul>
<li>所有者が事前に用意・確認した動画を、所有者本人のYouTubeチャンネルへアップロードします。</li>
<li>アップロードには YouTube Data API を使用し、所有者本人のOAuth認可に基づいて動作します。</li>
</ul>
